<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海报网站连接检测</title><style>body{font:16px/1.7 system-ui;margin:48px auto;padding:0 24px;max-width:560px;color:#1d1d1f;background:#f5f5f7}main{background:white;border-radius:20px;padding:28px}h1{font-size:24px}li{margin:14px 0}a,button{color:#0071e3}button{font:inherit;background:white;border:1px solid #ddd;border-radius:10px;padding:8px 16px}</style><main><h1>海报网站连接检测</h1><p>此页已打开：说明当前网络能够连接网站。检测仅访问本站，不上传个人信息。</p><ol><li>网络连接：成功</li><li id="page">页面文件：检测中…</li><li id="image">海报素材：检测中…</li></ol><p id="result" role="status">请稍候，最多约 10 秒。</p><button onclick="location.reload()">重新检测</button> <a href="./?v=bc2ddf0be75e">打开海报工具</a><p style="font-size:13px;color:#666">若需要反馈，请提供这三行检测结果和手机运营商名称。</p></main><script>
(async()=>{async function check(path,id,expected){let timer;const controller=new AbortController();try{timer=setTimeout(()=>controller.abort(),10000);const response=await fetch(path,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);if(expected){const text=await response.text();if(!text.includes(expected))throw Error('返回内容不是海报页面');}else await response.arrayBuffer();document.getElementById(id).textContent=(id==='page'?'页面文件':'海报素材')+'：成功';return true}catch(e){document.getElementById(id).textContent=(id==='page'?'页面文件':'海报素材')+'：失败（'+(e.name==='AbortError'?'连接超过 10 秒':e.message)+'）';return false}finally{clearTimeout(timer)}}const results=await Promise.all([check('./?connection-check=1','page','bc2ddf0be75e'),check('./assets/optimized/bg1.webp?connection-check=1','image')]);document.getElementById('result').textContent=results.every(Boolean)?'页面与素材均可连接，可以打开海报工具。':'部分请求失败，请保留上方结果，以便定位问题。';})();
</script></html>
